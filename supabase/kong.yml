# ── Storage ───────────────────────────────────────────────────────────────────
- name: storage-v1
  url: http://storage:5000/
  routes:
    - name: storage-v1
      strip_path: true
      paths:
        - /storage/v1/
  plugins:
    - name: cors
    - name: jwt
      config:
        secret_is_base64: false
