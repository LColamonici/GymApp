##############################################################################
# Digital Twin Gym — Full-stack docker-compose
#
# Usage:
#   cp .env.docker .env          # configure secrets
#   docker compose up --build    # first run (builds app image + runs migrations)
#   docker compose up            # subsequent runs
#   docker compose down -v       # tear down including volumes
#
# Services:
#   db          PostgreSQL 15 with all Supabase extensions
#   auth        GoTrue (Supabase Auth)
#   rest        PostgREST (auto-generated REST API)
#   realtime    Supabase Realtime (websocket subscriptions)
#   storage     Supabase Storage API
#   meta        pg-meta (schema introspection, used by Studio)
#   kong        API gateway — all Supabase traffic enters here (:8000)
#   studio      Supabase Studio dashboard (:3001)
#   migrations  One-shot migration runner (runs then exits)
#   app         Next.js application (:3000)
#
# Port summary:
#   3000  → Next.js app
#   8000  → Kong (Supabase API — what NEXT_PUBLIC_SUPABASE_URL points to)
#   3001  → Supabase Studio (optional admin UI)
#   5432  → PostgreSQL (not exposed by default — remove comment to enable)
##############################################################################

name: digital-twin-gym

x-db-env: &db-env
  POSTGRES_HOST: db
  POSTGRES_PORT: "5432"
  POSTGRES_DB: postgres
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}

x-supabase-db-url: &supabase-db-url
  DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/postgres

services:

  # ────────────────────────────────────────────────────────────────────────────
  # PostgreSQL — supabase/postgres ships with all required extensions
  # (pgcrypto, uuid-ossp, pgjwt, pg_stat_statements, etc.) and the
  # auth/storage/realtime schemas pre-created.
  # ────────────────────────────────────────────────────────────────────────────
  db:
    image: supabase/postgres:15.8.1.085
    restart: unless-stopped
    environment:
      <<: *db-env
      POSTGRES_INITDB_ARGS: "--data-checksums"
      JWT_SECRET: ${JWT_SECRET}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - supabase
    # Uncomment to expose Postgres to the host for debugging:
    # ports:
    #   - "5432:5432"

  # ────────────────────────────────────────────────────────────────────────────
  # Migrations — runs all SQL files in order then exits (exit 0).
  # Depends on db being healthy. Uses plain postgres:15 (no extra tooling needed).
  # ────────────────────────────────────────────────────────────────────────────
  migrations:
    image: postgres:15-alpine
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - ./supabase/migrations:/migrations:ro
    entrypoint: >
      sh -c "
        echo '==> Running migrations...' &&
        for f in /migrations/*.sql; do
          echo \"  -> $$f\";
          psql -h db -U postgres -d postgres -f \"$$f\" || exit 1;
        done &&
        echo '==> Migrations complete.'
      "
    networks:
      - supabase
    restart: "no"

  # ────────────────────────────────────────────────────────────────────────────
  # GoTrue — Supabase Auth
  # ────────────────────────────────────────────────────────────────────────────
  auth:
    image: supabase/gotrue:v2.186.0
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    environment:
      GOTRUE_API_HOST: "0.0.0.0"
      GOTRUE_API_PORT: "9999"
      API_EXTERNAL_URL: ${SITE_URL:-http://localhost:3000}
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD:-postgres}@db:5432/postgres
      GOTRUE_SITE_URL: ${SITE_URL:-http://localhost:3000}
      GOTRUE_URI_ALLOW_LIST: ${ADDITIONAL_REDIRECT_URLS:-}
      GOTRUE_DISABLE_SIGNUP: "false"
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: "3600"
      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_MAILER_AUTOCONFIRM: "true"     # auto-confirm emails in dev
      GOTRUE_SMTP_ADMIN_EMAIL: admin@example.com
      GOTRUE_SMTP_HOST: ""
      GOTRUE_SMTP_PORT: "587"
      GOTRUE_SMTP_USER: ""
      GOTRUE_SMTP_PASS: ""
      GOTRUE_SMTP_SENDER_NAME: Digital Twin Gym
    networks:
      - supabase
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9999/health | grep -q 'ok'"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ────────────────────────────────────────────────────────────────────────────
  # PostgREST — auto-generated REST API from the Postgres schema
  # ────────────────────────────────────────────────────────────────────────────
  rest:
    image: postgrest/postgrest:v14.6
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD:-postgres}@db:5432/postgres
      PGRST_DB_SCHEMAS: public,storage,graphql_public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_DB_USE_LEGACY_GUCS: "false"
      PGRST_APP_SETTINGS_JWT_SECRET: ${JWT_SECRET}
      PGRST_APP_SETTINGS_JWT_EXP: "3600"
    networks:
      - supabase
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/ | grep -q 'OpenAPI'"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ────────────────────────────────────────────────────────────────────────────
  # Realtime — websocket subscriptions (used for live inventory sync later)
  # ────────────────────────────────────────────────────────────────────────────
  realtime:
    image: supabase/realtime:v2.76.5
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    environment:
      PORT: "4000"
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: supabase_admin
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      DB_NAME: postgres
      DB_AFTER_CONNECT_QUERY: "SET search_path TO _realtime"
      DB_ENC_KEY: supabaserealtime
      API_JWT_SECRET: ${JWT_SECRET}
      FLY_ALLOC_ID: fly123
      FLY_APP_NAME: realtime
      SECRET_KEY_BASE: UpNVntn3cDxHJpq99YMc1T1AQgQpc8kfYTuRgBiYa15BLrx8etQoXz3gZv1/u2oq
      ERL_AFLAGS: -proto_dist inet_tcp
      ENABLE_TAILSCALE: "false"
      DNS_NODES: "''"
    networks:
      - supabase

  # ────────────────────────────────────────────────────────────────────────────
  # Storage API
  # ────────────────────────────────────────────────────────────────────────────
  storage:
    image: supabase/storage-api:v1.44.2
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
      rest:
        condition: service_healthy
    environment:
      ANON_KEY: ${ANON_KEY}
      SERVICE_KEY: ${SERVICE_ROLE_KEY}
      POSTGREST_URL: http://rest:3000
      PGRST_JWT_SECRET: ${JWT_SECRET}
      DATABASE_URL: postgres://supabase_storage_admin:${POSTGRES_PASSWORD:-postgres}@db:5432/postgres
      FILE_SIZE_LIMIT: "52428800"
      STORAGE_BACKEND: file
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      TENANT_ID: stub
      REGION: stub
      GLOBAL_S3_BUCKET: stub
      ENABLE_IMAGE_TRANSFORMATION: "true"
      IMGPROXY_URL: http://imgproxy:8080
    volumes:
      - storage-data:/var/lib/storage
    networks:
      - supabase

  # ────────────────────────────────────────────────────────────────────────────
  # imgproxy — image transformation for Storage
  # ────────────────────────────────────────────────────────────────────────────
  imgproxy:
    image: darthsim/imgproxy:v3.30.1
    restart: unless-stopped
    environment:
      IMGPROXY_BIND: ":8080"
      IMGPROXY_LOCAL_FILESYSTEM_ROOT: /
      IMGPROXY_USE_ETAG: "true"
      IMGPROXY_ENABLE_WEBP_DETECTION: "true"
    volumes:
      - storage-data:/var/lib/storage:ro
    networks:
      - supabase

  # ────────────────────────────────────────────────────────────────────────────
  # pg-meta — schema introspection API (used by Studio)
  # ────────────────────────────────────────────────────────────────────────────
  meta:
    image: supabase/postgres-meta:v0.95.2
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PG_META_PORT: "8080"
      PG_META_DB_HOST: db
      PG_META_DB_PORT: "5432"
      PG_META_DB_NAME: postgres
      PG_META_DB_USER: supabase
      PG_META_DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    networks:
      - supabase

  # ────────────────────────────────────────────────────────────────────────────
  # Kong — API gateway
  # All Supabase client traffic enters here. Exposed on host :8000.
  # NEXT_PUBLIC_SUPABASE_URL=http://localhost:8000 (browser)
  # SUPABASE_URL=http://kong:8000            (SSR / docker-internal)
  # ────────────────────────────────────────────────────────────────────────────
  kong:
    image: kong/kong:3.9.1
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /etc/kong/kong.yml
      KONG_DNS_ORDER: LAST,A,CNAME
      KONG_PLUGINS: request-transformer,cors,key-auth,acl,jwt,basic-auth
      KONG_NGINX_PROXY_PROXY_BUFFER_SIZE: 160k
      KONG_NGINX_PROXY_PROXY_BUFFERS: "64 160k"
    volumes:
      - ./supabase/kong.yml:/etc/kong/kong.yml:ro
    ports:
      - "8000:8000"   # Supabase API (HTTP)
      - "8443:8443"   # Supabase API (HTTPS — configure certs for prod)
    networks:
      - supabase
    healthcheck:
      test: ["CMD-SHELL", "kong health"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ────────────────────────────────────────────────────────────────────────────
  # Supabase Studio — optional admin dashboard (:3001)
  # ────────────────────────────────────────────────────────────────────────────
  studio:
    image: supabase/studio:2026.03.16-sha-5528817
    restart: unless-stopped
    depends_on:
      kong:
        condition: service_healthy
    environment:
      STUDIO_PG_META_URL: http://meta:8080
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      DEFAULT_ORGANIZATION_NAME: Digital Twin Gym
      DEFAULT_PROJECT_NAME: local
      SUPABASE_URL: http://kong:8000
      SUPABASE_PUBLIC_URL: http://localhost:8000
      SUPABASE_ANON_KEY: ${ANON_KEY}
      SUPABASE_SERVICE_KEY: ${SERVICE_ROLE_KEY}
      AUTH_JWT_SECRET: ${JWT_SECRET}
      LOGFLARE_API_KEY: ""
      LOGFLARE_URL: ""
      NEXT_PUBLIC_ENABLE_LOGS: "false"
    ports:
      - "3001:3000"
    networks:
      - supabase

  # ────────────────────────────────────────────────────────────────────────────
  # Next.js app
  # Built from the local Dockerfile (multi-stage, standalone output).
  # Depends on migrations completing so the schema is ready before first request.
  # ────────────────────────────────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Embedded in the client bundle at build time — must be browser-reachable
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-http://localhost:8000}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:-${ANON_KEY}}
    restart: unless-stopped
    depends_on:
      kong:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    environment:
      # Browser (baked into JS bundle at build — must match build args above)
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-http://localhost:8000}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${ANON_KEY}
      # SSR (docker-internal, overrides NEXT_PUBLIC_ for server-side requests)
      SUPABASE_URL: http://kong:8000
      SUPABASE_ANON_KEY: ${ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY}
      NODE_ENV: production
    ports:
      - "3000:3000"
    networks:
      - supabase

##############################################################################
# Volumes
##############################################################################
volumes:
  db-data:
    driver: local
  storage-data:
    driver: local

##############################################################################
# Networks
##############################################################################
networks:
  supabase:
    driver: bridge
